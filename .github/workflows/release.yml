name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - src-tauri/tauri.conf.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: version
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $version = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $packageVersion = (Get-Content "package.json" -Raw | ConvertFrom-Json).version

          if ($version -notmatch '^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$') {
            throw "Invalid application version '$version' in src-tauri/tauri.conf.json."
          }
          if ($packageVersion -ne $version) {
            throw "Version mismatch: package.json is $packageVersion but src-tauri/tauri.conf.json is $version. Run 'npm run version:bump -- <version>'."
          }

          $bumped = $true
          if ("${{ github.event_name }}" -eq "push") {
            $before = "${{ github.event.before }}"
            if ($before -and $before -notmatch '^0+$') {
              $previousRaw = git show "${before}:package.json" 2>$null
              if ($LASTEXITCODE -eq 0 -and $previousRaw) {
                $previous = ($previousRaw -join "`n") | ConvertFrom-Json
                $bumped = ($previous.version -ne $packageVersion)
              }
            }
          }

          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`n")
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "tag=v$version`n")
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "bumped=$($bumped.ToString().ToLower())`n")
          Write-Output "Clubify version $version (release: $bumped)"

      - name: Skip unchanged version
        if: steps.version.outputs.bumped != 'true'
        shell: powershell
        run: Write-Output "Version ${{ steps.version.outputs.version }} was already released; nothing to build."

      - name: Set up Node.js
        if: steps.version.outputs.bumped == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        if: steps.version.outputs.bumped == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        if: steps.version.outputs.bumped == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Verify updater signing key
        if: steps.version.outputs.bumped == 'true'
        shell: powershell
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY repository secret. Add the private updater key generated by 'npx tauri signer generate' before publishing a release."
          }

      - name: Install dependencies
        if: steps.version.outputs.bumped == 'true'
        run: npm ci

      - name: Package the audio engine
        if: steps.version.outputs.bumped == 'true'
        run: npm run package:engine

      - name: Build and publish GitHub release
        if: steps.version.outputs.bumped == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: Clubify ${{ steps.version.outputs.version }}
          releaseBody: |
            Windows installer for Clubify ${{ steps.version.outputs.version }}.

            Installed copies update automatically from the latest GitHub release.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
