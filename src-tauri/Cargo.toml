[package]
name = "clubify"
version = "0.2.5"
description = "Spotify-only nightclub DSP for Windows"
authors = ["Luke Grandke"]
license = "GPL-3.0"
repository = "https://github.com/tall1on/clubify"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
